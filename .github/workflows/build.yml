name: Build

# O que dispara o build. Push na main gera o .zip portavel; pull request so
# valida. Tag cria release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela builds antigos da mesma branch: em push seguido, nao ha razao para
# esperar dois jobs usando a mesma maquina.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Qt 6.8 LTS: escolha estavel, com binarios para Windows 10 sem aceleracao.
  # A versao precisa ser identica em todos os passos: o cache do Qt e chaveado
  # por ela, e um patch diferente faria o cache ser ignorado.
  QT_VERSION: '6.8.3'
  # O nome do alvo do aqt e o nome da PASTA que ele cria, e sao diferentes.
  #   alvo aqt: win64_msvc2022_64
  #   pasta:    C:\Qt\6.8.3\msvc2022_64
  # Usar o mesmo nome nos dois e o erro que fez a primeira build falhar.
  # Verifique com `aqt list-qt windows desktop --arch <versao>` e, depois de
  # instalar, com `ls C:\Qt\<versao>`.
  QT_ARCH: 'win64_msvc2022_64'
  QT_DIR_NAME: 'msvc2022_64'
  AQT_VERSION: '3.1.21'

jobs:
  build:
    name: Compilar e empacotar (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Copiar o codigo
        uses: actions/checkout@v4

      # O guard roda primeiro, antes de baixar 2 GB de Qt. Ele e o passo mais
      # barato do job e pega erro de link (metodo declarado sem definicao),
      # membro inexistente, modulo de Qt faltando e alvo de CMake renomeado
      # - todos eles que o compilador so acusa muito depois, ou nunca.
      - name: Verificacao estatica (guard)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # O proprio guard se testa: injeta bugs conhecidos numa copia e
          # falha se o guard nao achar. Sem isso, um guard quebrado "passa"
          # em tudo e o passo abaixo verde nao significa nada.
          python tools/test_guard.py

          # --includes fica de fora: include transitiva e a regra no mundo
          # real e essa regra reporta mais ruido que sinal.
          python tools/guard.py

      - name: Cache do Qt
        # O Qt tem ~2 GB; baixar a cada build gasta metade do tempo do job.
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt-${{ env.QT_VERSION }}-${{ env.AQT_VERSION }}-win64
          restore-keys: qt-${{ env.QT_VERSION }}-win64

      - name: Instalar o Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          pip install aqtinstall==$env:AQT_VERSION

          # Sem qtshadertools: ele traz um compilador de shader da NVIDIA que
          # o Lumina nao usa (nossos shaders sao GLSL puro, compilados pelo
          # driver). Deixar de fora corta ~200 MB do download e do cache.
          aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH -O C:\Qt

      - name: Verificar a instalacao do Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # O aqt cria C:\Qt\<versao>\<pasta>. A pasta NAO tem o prefixo do
          # alvo: alvo win64_msvc2022_64 vira pasta msvc2022_64. Descobrir a
          # pasta pelo que existe em disco e o que evita esse tipo de erro
          # silencioso.
          $versionDir = "C:\Qt\$env:QT_VERSION"
          if (-not (Test-Path $versionDir)) {
            throw "C:\Qt\$env:QT_VERSION nao existe. Conteudo de C:\Qt:"
            Get-ChildItem C:\Qt | ForEach-Object { Write-Host "  $($_.Name)" }
          }

          $qtRoot = Join-Path $versionDir $env:QT_DIR_NAME
          if (-not (Test-Path $qtRoot)) {
            $found = Get-ChildItem $versionDir -Directory | Select-Object -First 1
            if ($found) {
              throw "Esperava a pasta '$env:QT_DIR_NAME' mas o aqt criou '$($found.Name)'. Corrija QT_DIR_NAME no workflow."
            }
            throw "Nenhuma pasta de Qt em $versionDir"
          }

          # Verifica o que o build realmente usa. Falhar aqui, com caminho
          # explicito, e muito mais barato do que falhar tres passos depois no
          # CMake sem dizer qual arquivo sumiu.
          $required = @(
            'bin\qmake.exe',
            'bin\windeployqt.exe',
            'lib\cmake\Qt6\Qt6Config.cmake',
            'lib\cmake\Qt6Core\Qt6CoreConfig.cmake',
            'lib\cmake\Qt6Gui\Qt6GuiConfig.cmake',
            'lib\cmake\Qt6Widgets\Qt6WidgetsConfig.cmake',
            'lib\cmake\Qt6OpenGL\Qt6OpenGLConfig.cmake',
            'lib\cmake\Qt6OpenGLWidgets\Qt6OpenGLWidgetsConfig.cmake'
          )
          foreach($needed in $required) {
            $path = Join-Path $qtRoot $needed
            if (-not (Test-Path $path)) {
              throw "Qt instalado sem $needed. Raiz: $qtRoot"
            }
          }

          $size = [math]::Round((Get-ChildItem $qtRoot -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 0)
          Write-Host "Qt ok: $qtRoot ($size MB)"

      # Segunda passada do guard, agora com o Qt de verdade em disco. O
      # primeiro passo so conhece uma lista fixa de classes; com os headers
      # reais ele confere modulo a modulo, e pega classe de modulo raro que
      # a lista fixa nao tem.
      - name: Verificacao estatica (guard, com Qt instalado)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = "C:\Qt\$env:QT_VERSION\$env:QT_DIR_NAME"
          python tools/guard.py --qt $qtRoot
          if ($LASTEXITCODE -ne 0) {
            throw "guard achou problemas (veja acima)"
          }

      - name: Cache do FFmpeg
        uses: actions/cache@v4
        with:
          path: _deps/ffmpeg
          key: ffmpeg-dev-6.1-lgpl-win64

      - name: Obter o FFmpeg (LGPL, com headers)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path _deps | Out-Null

          # Build LGPL com headers: e o unico que podemos redistribuir junto
          # com um projeto sob LGPL. Os binarios "shared" do BtbN trazem
          # avcodec/avformat/swscale/swresample e os headers.
          $archive = '_deps/ffmpeg.zip'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath '_deps/ffmpeg' -Force
          Remove-Item $archive

          # O zip tem um subdiretorio com o nome do build. Encontrar a raiz de
          # verdade em vez de assumir o nome evita o erro de sempre: passar
          # _deps/ffmpeg para o CMake quando ele espera a pasta com include/.
          $root = Get-ChildItem '_deps/ffmpeg' -Directory |
                  Where-Object { Test-Path (Join-Path $_.FullName 'include/libavcodec/avcodec.h') } |
                  Select-Object -First 1
          if (-not $root) {
            throw "FFmpeg descompactado sem include/libavcodec/avcodec.h. Estrutura:"
            Get-ChildItem '_deps/ffmpeg' -Recurse -Depth 2 -Directory |
              ForEach-Object { Write-Host "  $($_.FullName)" }
          }

          # Falhar aqui, com caminho, e mais barato do que o CMake reclamar de
          # header nao encontrado tres passos depois.
          $required = @(
            'include\libavcodec\avcodec.h',
            'include\libavutil\version.h',
            'lib\avcodec.lib', 'lib\avutil.lib', 'lib\avformat.lib',
            'lib\swscale.lib', 'lib\swresample.lib'
          )
          foreach($needed in $required) {
            if (-not (Test-Path (Join-Path $root.FullName $needed))) {
              throw "FFmpeg sem $needed. Raiz: $($root.FullName)"
            }
          }

          # Salva a raiz para os passos seguintes. GITHUB_ENV e o unico lugar
          # que persiste variaveis entre steps.
          "FFMPEG_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "FFmpeg ok em $($root.FullName)"

      # O log do Actions so e legivel com autenticacao, e o erro do CMake e
      # exatamente o que interessa. O step summary de um repositorio publico
      # aparece na pagina do run sem login, entao o erro vai para la. Sem
      # isso, cada falha custa um run inteiro so para descobrir o que era.
      - name: Configurar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:Path = "C:\Qt\${{ env.QT_VERSION }}\${{ env.QT_DIR_NAME }}\bin;$env:Path"

          # FFMPEG_ROOT vem do passo anterior, que descobriu a pasta real.
          if (-not (Test-Path $env:FFMPEG_ROOT)) {
            throw "FFMPEG_ROOT nao chegou neste passo: '$env:FFMPEG_ROOT'"
          }

          $log = 'configurar.log'
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DLUMINA_SHIPPING=ON `
            -DLUMINA_BUILD_TESTS=ON `
            -DLUMINA_ENABLE_FFMPEG=ON `
            -DFFMPEG_ROOT="$env:FFMPEG_ROOT" `
            -DCMAKE_PREFIX_PATH="C:/Qt/${{ env.QT_VERSION }}/${{ env.QT_DIR_NAME }}" *>&1 |
            Tee-Object -FilePath $log

          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $erro = Get-Content $log -Tail 60
            "### Configurar falhou (codigo $code)`n``````text`n$($erro -join "`n")`n``````" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw "cmake falhou com codigo $code (saida completa no resumo deste step)"
          }
          "Configurar ok" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Compilar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:Path = "C:\Qt\${{ env.QT_VERSION }}\${{ env.QT_DIR_NAME }}\bin;$env:Path"

          $log = 'compilar.log'
          cmake --build build --config Release --parallel *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            # O compilador acusa na ordem inversa e a ultima linha raramente e
            # a causa. O que resolve o erro esta no meio, entao vai tudo.
            $erro = Get-Content $log -Tail 200
            "### Compilar falhou (codigo $code)`n``````text`n$($erro -join "`n")`n``````" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw "compilacao falhou com codigo $code (saida completa no resumo deste step)"
          }
          "Compilar ok" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Testes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "C:\Qt\${{ env.QT_VERSION }}\${{ env.QT_DIR_NAME }}\bin;$env:Path"
          $env:QT_QPA_PLATFORM = 'offscreen'

          $exe = 'build/tests/Release/lumina_tests.exe'
          if (-not (Test-Path $exe)) {
            $exe = 'build/src/tests/Release/lumina_tests.exe'
          }
          Write-Host "Executando: $exe"
          & $exe

      - name: Render de referencia (headless)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "C:\Qt\${{ env.QT_VERSION }}\${{ env.QT_DIR_NAME }}\bin;$env:Path"
          $env:QT_QPA_PLATFORM = 'offscreen'

          $lumina = 'build/src/app/Release/lumina.exe'
          if (-not (Test-Path $lumina)) { $lumina = 'build/src/app/Release/lumina' }

          # Renderiza um quadro sem abrir janela. Prova que o caminho de
          # exportacao funciona no CI, e nao so na maquina de quem escreveu.
          & $lumina --render "$PWD/artifacts/frame.png"
          if ($LASTEXITCODE -ne 0) {
            throw "render headless falhou com codigo $LASTEXITCODE"
          }
          if (-not (Test-Path 'artifacts/frame.png')) {
            throw "render nao gerou o arquivo"
          }
          $size = (Get-Item 'artifacts/frame.png').Length
          Write-Host "frame.png: $size bytes"
          if ($size -lt 1000) {
            throw "frame.png pequeno demais: $size bytes (provavelmente vazio)"
          }

      - name: Montar a pasta portatil
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "C:\Qt\${{ env.QT_VERSION }}\${{ env.QT_DIR_NAME }}\bin;$env:Path"

          $outDir = 'dist/Lumina'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $lumina = 'build/src/app/Release/lumina.exe'
          if (-not (Test-Path $lumina)) { $lumina = 'build/src/app/Release/lumina' }
          Copy-Item $lumina $outDir

          # Deploy do Qt: copia as DLLs, o estilo e o qwindows. E o que torna
          # a pasta portavel - sem instalador, sem registro, sem depender de
          # nada instalado na maquina.
          & "C:\Qt\${{ env.QT_VERSION }}\${{ env.QT_DIR_NAME }}\bin\windeployqt.exe" `
            --no-translations --no-system-d3d-compiler --no-opengl-sw `
            --no-quick-import --compiler-runtime `
            $outDir

          # FFmpeg junto: o executavel depende das DLLs de $FFMPEG_ROOT\bin.
          # Sem -ErrorAction SilentlyContinue a copia silenciosamente nao
          # copiaria nada e o .zip sairia sem FFmpeg, quebrando so na maquina
          # de quem baixou.
          $dlls = Get-ChildItem (Join-Path $env:FFMPEG_ROOT 'bin/*.dll') -ErrorAction Stop
          if ($dlls.Count -lt 5) {
            throw "FFmpeg com $($dlls.Count) DLL(s) em $env:FFMPEG_ROOT\bin; esperado avcodec, avformat, avutil, swscale e swresample"
          }
          Copy-Item $dlls.FullName $outDir
          Write-Host "FFmpeg: $($dlls.Count) DLLs copiadas"

          # Documentacao dentro da pasta: quem extrai o zip tem tudo.
          Copy-Item 'README.md' $outDir -ErrorAction SilentlyContinue
          Copy-Item 'LICENSE' $outDir -ErrorAction SilentlyContinue

          Write-Host "Pasta portavel:"
          Get-ChildItem $outDir | Select-Object Name, Length

      - name: Verificar o tamanho
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $total = (Get-ChildItem 'dist/Lumina' -Recurse -File |
                    Measure-Object -Property Length -Sum).Sum
          $mb = [math]::Round($total / 1MB, 1)
          Write-Host "Tamanho total: $mb MB"

          # Budget: um editor "ultra leve" que passa de 120 MBinstalled nao e
          # ultra leve, e o numero precisa de um alarme quando crescer.
          if ($mb -gt 120) {
            Write-Warning "A pasta portavel passou de 120 MB ($mb MB). Reveja o que esta sendo copiado."
          }

      - name: Comprimir
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $version = (Select-String -Path 'src/app/main.cpp' -Pattern 'setApplicationVersion\("([^"]+)"').Matches[0].Groups[1].Value
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $name = "Lumina-$version-win64-$sha.zip"

          Compress-Archive -Path 'dist/Lumina/*' -DestinationPath "artifacts/$name" -CompressionLevel Optimal
          Write-Host "Gerado: artifacts/$name"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-portatil-win64
          path: artifacts/*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publicar artefato (frame de referencia)
        uses: actions/upload-artifact@v4
        with:
          name: frame-referencia
          path: artifacts/frame.png
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: build
    # So cria release quando ha tag. Em push na main, o artefato ja basta.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Baixar o pacote
        uses: actions/download-artifact@v4
        with:
          name: Lumina-portatil-win64
          path: zip

      - name: Criar a release
        uses: softprops/action-gh-release@v2
        with:
          files: zip/*.zip
          generate_release_notes: true
          body: |
            ## Lumina

            Editor de video portatil: composicao por nos, linha do tempo
            multipista e correcao de cor.

            **Como usar:** extraia o zip em qualquer pasta e execute `lumina.exe`.
            Nao instala nada, nao escreve no registro, nao precisa de permissao
            de administrador.

            **Requisitos:** Windows 10 ou superior. O renderizador usa OpenGL 3.3;
            em maquina sem GPU dedicada o editor detecta e sugere o modo leve.
